# ============================================================================
# Fruit Knight - master configuration
# Every technical and gameplay parameter lives here (no magic numbers in code).
# Units: pixels, seconds, degrees unless stated otherwise.
# ============================================================================

window:
  width: 1920
  height: 1080
  fps: 60                      # target frames per second
  title: "Fruit Knight"
  fullscreen: true

countdown_seconds: 3.0         # pre-match and post-pause countdown

# ----------------------------------------------------------------------------
# Physics (Pymunk). Screen coordinates: +y points down.
# ----------------------------------------------------------------------------
physics:
  gravity: 620.0               # base gravity g0 in px/s^2 (g_eff = g0 * weight)
  substeps: 2                  # physics sub-steps per rendered frame
  damping: 0.9                 # Pymunk velocity damping (1.0 = no air drag)
  spawn_offset: 80.0           # px below the bottom edge where entities spawn
  exit_margin: 90.0            # px beyond the screen edge before an entity counts as exited
  max_spin: 6.0                # max random angular velocity at spawn (rad/s)
  max_entity_speed: 2400.0     # clamp for thrown entity speed (px/s)

# ----------------------------------------------------------------------------
# Dynamic difficulty: fruit stream spawn interval over match time t:
#   interval(t) = max(min_spawn_interval, base_spawn_interval * exp(-rate * t)) * U(jitter)
# Hazard intervals are divided by exp(rate * t / 2) so they also tighten slowly.
# ----------------------------------------------------------------------------
spawning:
  base_spawn_interval: 2
  spawn_acceleration_rate: 0.006
  jitter_range: [0.75, 1.25]
  min_spawn_interval: 0.35     # hard ceiling on spawn rate
  spawn_margin_ratio: 0.12     # horizontal inset of the spawn band (fraction of width)
  fruit_initial_delay_range: [0.5, 1.2]

# ----------------------------------------------------------------------------
# Entities
# ----------------------------------------------------------------------------
fruits:
  elasticity: 0.35
  friction: 0.6
  launch:
    min_height_ratio: 0.35     # apex height / screen height measured from spawn point
    max_height_ratio: 0.92
    min_angle_deg: 2.0         # launch angle from the vertical axis
    max_angle_deg: 24.0
    edge_zone_ratio: 0.3       # spawns within this width fraction of an edge always head to the opposite side
  subtypes:
    watermelon:
      weight: 2.0
      radius: 100
      points: 30
      color: [76, 175, 80]
      spawn_weight: 1.0
      sprite_path: assets/sprites/fruits/watermelon.png
    coconut:
      weight: 1.4
      radius: 80
      points: 20
      color: [141, 98, 66]
      spawn_weight: 1.2
      sprite_path: assets/sprites/fruits/coconut.png
    apple:
      weight: 1.0
      radius: 60
      points: 10
      color: [229, 57, 53]
      spawn_weight: 2.2
      sprite_path: assets/sprites/fruits/apple.png
    banana:
      weight: 0.9
      radius: 60
      points: 15
      color: [253, 216, 53]
      spawn_weight: 1.5
      sprite_path: assets/sprites/fruits/banana.png
    berry:
      weight: 0.5
      radius: 50
      points: 15
      color: [142, 36, 170]
      spawn_weight: 1.8
      sprite_path: assets/sprites/fruits/berry.png

bomb:
  weight: 1.1
  radius: 75
  color: [40, 40, 48]
  elasticity: 0.35
  friction: 0.6
  initial_delay_range: [5.0, 10.0]   # random dead-time before the first bomb
  interval_range: [3.5, 6.0]
  launch:
    min_height_ratio: 0.65
    max_height_ratio: 0.92
    min_angle_deg: 2.0
    max_angle_deg: 22.0
  sprite_path: assets/sprites/bombs/bomb.png

limiter:
  initial_delay_range: [14.0, 20.0]
  interval_range: [15.0, 25.0]
  min_y_ratio: 0.35            # spawn height range (fraction of screen height)
  max_y_ratio: 0.7
  max_incline_deg: 12.0        # inclination alpha in [-max, +max]
  advance_speed: 180.0         # px/s extension speed
  retract_speed: 600.0         # px/s retraction speed after expiry
  lifetime_range: [5.0, 12.0]  # total life T_limit in seconds
  thickness: 50.0
  tip_hit_radius: 52.0         # palm-vs-tip hitbox radius
  elasticity: 0.45
  friction: 0.7
  sprite_path: assets/sprites/limiters/trunk.png
  beam_sprite_path: assets/sprites/limiters/beam.png

holder:
  weight: 1.0
  radius: 80
  initial_delay_range: [8.0, 22.0]
  interval_range: [12.0, 22.0]
  hold_duration_range: [1.5, 3.5]    # required accumulated fist time D_hold
  elasticity: 0.3
  friction: 0.6
  launch:
    min_height_ratio: 0.65
    max_height_ratio: 0.9
    min_angle_deg: 2.0
    max_angle_deg: 18.0
  active_sprite_path: assets/sprites/holders/holder_active.png
  defused_sprite_path: assets/sprites/holders/holder_defused.png
  active_color: [255, 112, 67]
  defused_color: [102, 187, 106]

thrower:
  weight: 1.0
  radius: 80
  initial_delay_range: [20.0, 40.0]
  interval_range: [18.0, 30.0]
  expiration_range: [5.0, 10.0]      # expiry timer before it counts as failed
  elasticity: 0.3
  friction: 0.6
  launch:
    min_height_ratio: 0.6
    max_height_ratio: 0.85
    min_angle_deg: 2.0
    max_angle_deg: 16.0
  zone_thickness: 110.0              # target zone depth in px
  zone_length_ratio: 0.5             # zone length as fraction of the screen edge
  sprite_path: assets/sprites/throwers/thrower.png
  zone_sprite_path: assets/sprites/throwers/target_portal.png
  color: [66, 165, 245]

# ----------------------------------------------------------------------------
# Scoring and versus rules
# Score_i = sum(fruit points) + holders*holder_points + throwers*thrower_points
#           + floor(survival_seconds * time_multiplier)
#           + goals*football_goal_points - penalty points (competition/points mode)
# ----------------------------------------------------------------------------
scoring:
  holder_points: 50            # awarded on defusal
  thrower_points: 75
  time_multiplier: 0.5         # points per survived second (M_time)
  penalty_points_loss: 25      # competition mode with point penalties
  football_goal_points: 100

football:
  goal_bottom_edge_ratio: 0.1  # goal extends along this fraction of the bottom edge per side

# ----------------------------------------------------------------------------
# Hand gesture classification and interaction
# Ratios are scale-invariant (relative to palm size or wrist distances).
# ----------------------------------------------------------------------------
gestures:
  extended_ratio: 1.25                 # tip-wrist / pip-wrist above this => finger extended
  fist_curl_ratio: 1.15                # tip-wrist / pip-wrist below this => finger curled
  min_curled_fingers: 3                # curled fingers required for CLOSED_FIST
  knife_finger_spread_max_ratio: 0.42  # adjacent tip distance / palm size
  throw_inertia_multiplier: 1.05
  debounce_frames: 6                   # frames a posture must persist before switching
  velocity_window_s: 0.5               # history window for velocity estimation
  velocity_smoothing: 0.5              # EMA factor in [0, 1] (1 = no smoothing)
  knife_min_speed: 120.0               # px/s the hand must move to cut (a still knife hand never cuts)
  knife_thickness: 22.0                # px added to knife segment for contact tests
  grab_radius: 46.0                    # px added to entity radius for grabbing
  grab_grace_s: 0.35                   # open-hand memory window preceding a fist
  hand_lost_grace_s: 0.30              # time a vanished hand keeps its grabbed item
  hand_hit_radius: 54.0                # palm hitbox radius for open-palm checks

# ----------------------------------------------------------------------------
# Computer vision
# ----------------------------------------------------------------------------
tracking:
  default_mode: hands_only             # pose_hands | hands_only
  pose_model_file: pose_landmarker_lite.task
  hand_model_file: hand_landmarker.task
  pose_model_url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
  hand_model_url: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  assign_max_distance: 0.45            # max normalized wrist distance to link a hand to a pose
  max_inference_side: 640              # downscale frames above this size before inference
  max_inference_fps: 30                # cap of detections per second (frees CPU for the game loop)
  camera:
    default_index: 0
    request_width: 1920
    request_height: 1080
    request_fps: 60
    fourcc: MJPG                       # compressed camera stream (much faster than raw at HD)
    index_options: [0, 1, 2, 3, 4]

# ----------------------------------------------------------------------------
# Players and look & feel
# ----------------------------------------------------------------------------
players:
  colors:                              # Player 1..4: cyan, coral red, lime green, gold
    - [0, 229, 255]
    - [255, 99, 99]
    - [118, 255, 3]
    - [255, 215, 0]
  names: ["Player 1", "Player 2", "Player 3", "Player 4"]

ui:
  background_color: [14, 16, 28]
  panel_color: [24, 28, 48]
  accent_color: [255, 171, 64]
  text_color: [236, 239, 244]
  muted_color: [140, 150, 175]
  danger_color: [255, 82, 82]
  camera_dim_alpha: 70                 # dark overlay (0-255) on the camera feed
  trail_length: 20                     # slice trail points
  trail_lifetime_s: 0.25
  popup_lifetime_s: 1.0
  icon_path: assets/icon.ico
  heart_sprite_path: assets/sprites/ui/heart.png
  background_sprite_path: assets/sprites/ui/background.png
  logo_sprite_path: assets/sprites/ui/logo.png

# ----------------------------------------------------------------------------
# Optional sound effects (keys are game event kinds). Missing files are skipped silently.
# ----------------------------------------------------------------------------
audio:
  enabled: true
  volume: 0.7
  sounds:
    slice: assets/audio/slice.wav
    explosion: assets/audio/explosion.wav
    grab: assets/audio/grab.wav
    release: assets/audio/throw.wav
    defuse: assets/audio/defuse.wav
    thrower_success: assets/audio/success.wav
    goal: assets/audio/goal.wav
    eliminated: assets/audio/eliminated.wav

# ----------------------------------------------------------------------------
# Default values of the match setup screen
# ----------------------------------------------------------------------------
defaults:
  players: 1
  mode: 1p_endurance                   # 1p_endurance | np_endurance | np_competition | 2p_football
  lives: 3
  timespan: 120
  instant_death_bombs: false
  instant_death_grenades: false
  enable_bombs: true
  enable_limiters: true
  enable_holders: true
  enable_throwers: true
  competition_penalty: lives           # lives | points
  tracking_mode: hands_only
  difficulty: normal                   # key of the 'difficulties' section
  life_options: [1, 2, 3, 5, 7, 10]
  timespan_options: [30, 60, 120, 180, 300, 500]

# ----------------------------------------------------------------------------
# Difficulty levels. The values above are the NORMAL level. Each level below lists only what
# it changes: any key of this file (physics, spawning, fruits, bomb, limiter, holder, thrower,
# gestures, scoring...) can be overridden, nested exactly like in the sections above, e.g.
#   fruits: {launch: {max_angle_deg: 10}, subtypes: {apple: {radius: 40}}}
#
# How each knob moves with difficulty (easier -> harder):
#   physics.gravity        slower -> faster objects (launch speed is sqrt(2*g*weight*H), so it scales too)
#   fruit radius           bigger -> smaller
#   fruit heights          fruits fly HIGHER when easy (long hang time), LOWER when hard
#   bomb heights           bombs fly LOWER when easy (out of the way), HIGHER when hard (they get in the way)
#   spawn / hazard timing  rarer and later -> denser and earlier
#   gestures               more forgiving knife speed and hit radii -> stricter
# ----------------------------------------------------------------------------
difficulties:
  very_easy:                  # trivial for any able-bodied person: huge, slow, high fruits, few hazards
    label: "Very Easy"
    overrides:
      physics: {gravity: 300.0}
      spawning: {base_spawn_interval: 3.6, spawn_acceleration_rate: 0.001, min_spawn_interval: 2.0}
      fruits:
        launch: {min_height_ratio: 0.72, max_height_ratio: 0.95, min_angle_deg: 0.0, max_angle_deg: 8.0}
        subtypes:
          watermelon: {radius: 135}
          coconut: {radius: 108}
          apple: {radius: 81}
          banana: {radius: 81}
          berry: {radius: 68}
      bomb:
        radius: 90
        initial_delay_range: [30.0, 45.0]
        interval_range: [20.0, 30.0]
        launch: {min_height_ratio: 0.35, max_height_ratio: 0.6, min_angle_deg: 0.0, max_angle_deg: 8.0}
      limiter:
        initial_delay_range: [35.0, 50.0]
        interval_range: [30.0, 45.0]
        advance_speed: 70.0
        max_incline_deg: 4.0
        lifetime_range: [4.0, 6.0]
        tip_hit_radius: 100.0
      holder:
        radius: 100
        initial_delay_range: [40.0, 60.0]
        interval_range: [35.0, 50.0]
        hold_duration_range: [0.6, 1.0]
      thrower:
        radius: 100
        initial_delay_range: [60.0, 80.0]
        interval_range: [45.0, 60.0]
        expiration_range: [14.0, 18.0]
      gestures: {knife_min_speed: 40.0, knife_thickness: 40.0, grab_radius: 90.0}
  easy:                       # needs little concentration: big, slowish, high fruits, rare hazards
    label: "Easy"
    overrides:
      physics: {gravity: 420.0}
      spawning: {base_spawn_interval: 2.8, spawn_acceleration_rate: 0.003, min_spawn_interval: 1.0}
      fruits:
        launch: {min_height_ratio: 0.58, max_height_ratio: 0.93, min_angle_deg: 2.0, max_angle_deg: 14.0}
        subtypes:
          watermelon: {radius: 118}
          coconut: {radius: 94}
          apple: {radius: 71}
          banana: {radius: 71}
          berry: {radius: 59}
      bomb:
        radius: 82
        initial_delay_range: [15.0, 25.0]
        interval_range: [10.0, 16.0]
        launch: {min_height_ratio: 0.45, max_height_ratio: 0.7, min_angle_deg: 2.0, max_angle_deg: 14.0}
      limiter:
        initial_delay_range: [22.0, 32.0]
        interval_range: [22.0, 34.0]
        advance_speed: 120.0
        max_incline_deg: 8.0
        lifetime_range: [5.0, 8.0]
        tip_hit_radius: 80.0
      holder:
        radius: 90
        initial_delay_range: [25.0, 40.0]
        interval_range: [25.0, 38.0]
        hold_duration_range: [1.0, 2.0]
      thrower:
        radius: 90
        initial_delay_range: [40.0, 60.0]
        interval_range: [30.0, 45.0]
        expiration_range: [10.0, 14.0]
      gestures: {knife_min_speed: 70.0, knife_thickness: 30.0, grab_radius: 65.0}
  normal:                     # the base values above: a real challenge
    label: "Normal"
    overrides: {}
  hard:                       # very difficult: small, fast, low fruits; high bombs; relentless hazards
    label: "Hard"
    overrides:
      physics: {gravity: 880.0}
      spawning: {base_spawn_interval: 1.3, spawn_acceleration_rate: 0.012, min_spawn_interval: 0.28}
      fruits:
        launch: {min_height_ratio: 0.25, max_height_ratio: 0.88, min_angle_deg: 4.0, max_angle_deg: 32.0}
        subtypes:
          watermelon: {radius: 80}
          coconut: {radius: 64}
          apple: {radius: 48}
          banana: {radius: 48}
          berry: {radius: 40}
      bomb:
        radius: 62
        initial_delay_range: [2.0, 4.0]
        interval_range: [1.8, 3.5]
        launch: {min_height_ratio: 0.78, max_height_ratio: 0.97, min_angle_deg: 4.0, max_angle_deg: 30.0}
      limiter:
        initial_delay_range: [8.0, 14.0]
        interval_range: [8.0, 14.0]
        advance_speed: 260.0
        max_incline_deg: 16.0
        lifetime_range: [8.0, 14.0]
        tip_hit_radius: 44.0
      holder:
        radius: 65
        initial_delay_range: [6.0, 12.0]
        interval_range: [8.0, 14.0]
        hold_duration_range: [3.0, 5.0]
      thrower:
        radius: 65
        initial_delay_range: [12.0, 20.0]
        interval_range: [12.0, 20.0]
        expiration_range: [4.0, 6.0]
      gestures: {knife_min_speed: 220.0, knife_thickness: 16.0, grab_radius: 32.0}
